services:
  - type: web
    name: invoice-textract-saas
    runtime: node
    plan: free
    buildCommand: npm run prisma:generate && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/auth/csrf
    envVars:
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: PREVIEW_TOKEN_SECRET
        sync: false
